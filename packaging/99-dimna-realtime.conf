# /etc/security/limits.d/99-dimna-realtime.conf (installed by the dimna package)
# Lets members of the realtime group run dimna's acquisition thread SCHED_FIFO and lock its
# memory. pam_limits reads it when a session starts, so it takes effect at the next login.
# The package creates the realtime group if it is missing but never adds anyone to it.
# To add yourself (then log out and in):
#   sudo usermod -aG realtime $USER
# If you already use another group for this (audio, say), give it these lines instead.
@realtime   -   rtprio     80
@realtime   -   memlock    unlimited
